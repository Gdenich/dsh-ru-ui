# Publish to npm when a version tag is pushed.
#
# The shipped browser bundle is a committed build artifact, so publishing is a
# pure upload: nothing is compiled here. What this workflow does add is the
# gate — a tag that does not match the manifest version, or a bundle that is not
# reproducible from the dictionary, must never reach the registry.
#
# Setup (once): add an npm token with "Bypass 2FA" as the NPM_TOKEN secret.
#
# Release with an ANNOTATED tag: `git push --follow-tags` only carries
# annotated tags, so a lightweight `git tag v1.0.2` silently releases nothing.
#
#   npm version patch -m "Release %s"
#   git push origin master --follow-tags
name: publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Tag must match the manifest version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi

      # `build/` is a local artifact and is gitignored, so this job never has
      # build/ru.json. The bundle test recovers the inlined dictionary from the
      # committed artifact and re-renders it: that is the reproducibility claim
      # here, and it also runs the bundle against the stub page loader.
      - name: Shipped bundle is reproducible and activation works
        run: npm test

      - name: Tarball carries only the runtime files
        run: npm publish --dry-run

      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
